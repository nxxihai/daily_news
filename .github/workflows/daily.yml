# 每日新闻早报 - 云端定时推送
#
# 触发时间：每天北京时间 08:00（GitHub Actions 用 UTC，北京 8 点 = UTC 0 点）
# 手动触发：仓库 Actions 页面 → Daily News Report → Run workflow 按钮
#
# 首次使用前，请在仓库 Settings → Secrets and variables → Action 添加：
#   TIANAPI_KEY       天行数据 key（你 config.py 里那串）
#   OPENROUTER_API_KEY OpenRouter key（你 config.py 里那串 sk-or-v1-...）
#   SERVERCHAN_KEY    Server酱 SendKey（你 config.py 里那串 SCT...）
#   ZHIPU_API_KEY     智谱 GLM-4.7-Flash key（永久免费）
#   JUHE_KEY          可选，聚合数据 key，没有可留空不填
#   PUSHPLUS_TOKEN    可选，PushPlus token，没有可留空不填
#   OPENAI_API_KEY    可选，DeepSeek 官方 key，没有可留空不填
# 没填的环境变量会自动回退到 config.py 里的默认值，本地照常、云端不中断。

name: Daily News Report

on:
  schedule:
    - cron: '0 0 * * *'      # 每天 UTC 00:00 = 北京时间 08:00
  workflow_dispatch:          # 支持在网页上手动触发（部署后先用这个测试）
  push:                       # 临时：push 即触发，方便验证，验证完移除

permissions:
  contents: write             # 允许把去重记录 data/seen.json 写回仓库

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10       # 云端总超时护栏（脚本内部还有 180 秒护栏）
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily news report
        env:
          TIANAPI_KEY: ${{ secrets.TIANAPI_KEY }}
          JUHE_KEY: ${{ secrets.JUHE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python run_daily.py

      - name: Save dedup state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          if git diff --cached --quiet; then
            echo "No dedup changes, skip commit."
          else
            git commit -m "chore: update dedup state $(date -u +%F)"
            git push
            echo "Dedup state committed."
          fi
