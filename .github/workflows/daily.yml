# 每日新闻早报 - 云端定时推送
#
# 触发方式：由 cron-job.org 按北京时间 7:30 调用 GitHub API 触发 workflow_dispatch
# （准点、可靠，不受 GitHub 调度延迟影响）。本 workflow 内不再设 schedule。
# 也可在 Actions 页面 → Daily News Report → Run workflow 手动触发。
#
# 首次使用前，请在仓库 Settings → Secrets and variables → Action 添加：
#   DEEPSEEK_API_KEY     DeepSeek 官方 key（推荐付费通道，最优先使用，稳定且极便宜）
#   TIANAPI_KEY          天行数据 key（你 config.py 里那串）
#   OPENROUTER_API_KEY   OpenRouter key（你 config.py 里那串 sk-or-v1-...）
#   SERVERCHAN_KEY       Server酱 SendKey（你 config.py 里那串 SCT...）
#   ZHIPU_API_KEY        智谱 GLM-4.7-Flash key（永久免费）
#   MODELSCOPE_API_KEY   魔搭 ModelScope key（主模型 stepfun-ai/Step-3.7-Flash）
#   FREELLMAPI_API_KEY   FreeLLMAPI key（优先，若你要用它）
#   FREELLMAPI_BASE_URL  FreeLLMAPI Base URL（可选，默认会走官方地址）
#   FREELLMAPI_MODEL    FreeLLMAPI 模型名（可选，默认 qwen3-8b）
#   JUHE_KEY             可选，聚合数据 key，没有可留空不填
#   PUSHPLUS_TOKEN       可选，PushPlus token，没有可留空不填
# 没填的环境变量会自动回退到 config.py 里的默认值，本地照常、云端不中断。

name: Daily News Report

on:
  # 不设 schedule：定时统一交给 cron-job.org 触发下面的 workflow_dispatch。
  # 二者只能取其一，同时开着会导致一天推送多次。
  workflow_dispatch:          # 被 cron-job.org 调用；也可在 Actions 页面手动 Run workflow

permissions:
  contents: write             # 允许把去重记录 data/seen.json 写回仓库

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10       # 云端总超时护栏（脚本内部还有 180 秒护栏）
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'              # 缓存 pip 依赖，下次运行直接复用

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily news report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TIANAPI_KEY: ${{ secrets.TIANAPI_KEY }}
          JUHE_KEY: ${{ secrets.JUHE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          FREELLMAPI_BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
          FREELLMAPI_MODEL: ${{ secrets.FREELLMAPI_MODEL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python run_daily.py

      - name: Save dedup state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          if git diff --cached --quiet; then
            echo "No dedup changes, skip commit."
          else
            git commit -m "chore: update dedup state $(date -u +%F)"
            git push
            echo "Dedup state committed."
          fi
